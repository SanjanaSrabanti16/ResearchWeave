services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      RANKING_PROFILE: ${RANKING_PROFILE:-fast}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      RERANKER_MODEL: ${RERANKER_MODEL:-}
      RERANK_SHORTLIST_SIZE: ${RERANK_SHORTLIST_SIZE:-}
      RANKING_FUSION_MODE: ${RANKING_FUSION_MODE:-}
      CACHE_TTL_HOURS: ${CACHE_TTL_HOURS:-24}
      CANDIDATE_TARGET: ${CANDIDATE_TARGET:-240}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-20}
      PROVIDER_RETRIES: ${PROVIDER_RETRIES:-2}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      UNPAYWALL_EMAIL: ${UNPAYWALL_EMAIL:-}
      PDF_MAX_SIZE_MB: ${PDF_MAX_SIZE_MB:-50}
      PDF_DOWNLOAD_TIMEOUT_SECONDS: ${PDF_DOWNLOAD_TIMEOUT_SECONDS:-30}
      PDF_ALLOWED_HOSTS: ${PDF_ALLOWED_HOSTS:-}
      GROBID_URL: http://grobid:8070
      GROBID_TIMEOUT_SECONDS: ${GROBID_TIMEOUT_SECONDS:-120}
      GROBID_PARSER_VERSION: 0.9.1-crf+frontmatter-v1
      PARSED_DOCUMENT_CACHE_DIR: ${PARSED_DOCUMENT_CACHE_DIR:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      OLLAMA_BATCH_CHARS: ${OLLAMA_BATCH_CHARS:-13000}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      INSIGHT_CACHE_DIR: ${INSIGHT_CACHE_DIR:-}
      LLM_DIAGNOSTIC_DIR: ${LLM_DIAGNOSTIC_DIR:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-180}
      EVL_GEMMA_API_KEY: ${EVL_GEMMA_API_KEY:-}
      EVL_GEMMA_BASE_URL: ${EVL_GEMMA_BASE_URL:-https://sage200.evl.uic.edu}
      EVL_GEMMA_MODEL: ${EVL_GEMMA_MODEL:-gemma4}
      EVL_GEMMA_TIMEOUT_SECONDS: ${EVL_GEMMA_TIMEOUT_SECONDS:-180}
    volumes:
      - ./backend/data:/app/data
      - huggingface-cache:/root/.cache/huggingface
    restart: unless-stopped

  grobid:
    image: grobid/grobid:0.9.1-crf
    profiles: ["pdf"]
    init: true
    ports:
      - "8070:8070"
    ulimits:
      core: 0
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  huggingface-cache:
