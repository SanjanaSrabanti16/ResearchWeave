[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-landscape-backend"
version = "0.1.0"
description = "Retrieval and ranking backend for Research Landscape Explorer"
requires-python = ">=3.11"
dependencies = [
  "arxiv==4.0.1",
  "fastapi>=0.115,<1",
  "defusedxml>=0.7,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.18,<1",
  "sentence-transformers>=3.2,<6",
  "sqlalchemy>=2.0,<3",
  "torch>=2.2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.21,<1",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
